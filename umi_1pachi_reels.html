<style>

  .strip { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; will-change: transform; }
  .cell { height: 83.33px; display: flex; align-items: center; justify-content: center; font-size: 46px; line-height: 1; }
  .reel::after { content: ""; position: absolute; top: 83.33px; left: 0; right: 0; height: 83.33px;

    background: rgba(255,212,121,.08); pointer-events: none; }
  .reels.reach .reel::after { border-color: #ff9f43; background: rgba(255,159,67,.18); box-shadow: 0 0 18px rgba(255,159,67,.6); }
  .reels.reach { animation: reachshake .1s linear infinite; box-shadow: 0 0 30px rgba(255,159,67,.7), inset 0 0 18px rgba(0,0,0,.6); }
  @keyframes reachshake { 0%{transform:translate(0,0)} 25%{transform:translate(-3px,2px)} 50%{transform:translate(3px,-2px)} 75%{transform:translate(-2px,-2px)} 100%{transform:translate(2px,2px)} }

  .reels.win .reel::after { border-color: #ffe28a; background: rgba(255,212,121,.3); }

  /* 大当たり：短暂抖动0.6s（中奖时） */

  @keyframes bigshake {
    0%{transform:translate(0,0)} 20%{transform:translate(-6px,5px)} 40%{transform:translate(6px,-5px)}
    60%{transform:translate(-5px,-4px)} 80%{transform:translate(5px,4px)} 100%{transform:translate(-2px,2px)}
  }

  /* 中奖弹窗 */
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);

  .stat { margin-top: 10px; font-size: 12px; color: #bfe3ff; text-align: center; }

  .ctrl { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  @keyframes pop { 0%{transform:scale(.4)} 60%{transform:scale(1.25)} 100%{transform:scale(1)} }

  .item .owned { position: absolute; bottom: 3px; font-size: 9px; color: #6bff9e; }
  .credit { margin-top: 14px; font-size: 11px; color: #4a7ba3; text-align: center; }

  /* 神龙图鉴 */
  .dragon-panel { width: 100%; max-width: 390px; margin-top: 14px;

  .dragon-panel h3 { font-size: 13px; color: #7fdbff; letter-spacing: 2px; text-align: center; margin-bottom: 10px; text-shadow: 0 0 8px rgba(127,219,255,.5); }
  .dragon-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .dragon { aspect-ratio: 1; border-radius: 10px; background: rgba(2,16,25,.8); border: 1px solid #143a55;
    display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .dragon .d-ico { font-size: 34px; line-height: 1; filter: grayscale(1) brightness(.35); opacity: .5; transition: .3s; }
  .dragon.on .d-ico { filter: none; opacity: 1; text-shadow: 0 0 14px rgba(127,219,255,.9); animation: pop .5s ease; }

  /* 召唤神龙弹窗 */
  .dragon-ico { font-size: 80px; animation: dragonfly 1s ease-in-out infinite alternate; }
  @keyframes dragonfly { from{transform:translateY(0) scale(1)} to{transform:translateY(-12px) scale(1.1)} }

<body>
<div class="phone">
  <div class="title">🌊 海物語 1/99.9</div>
  <div class="prob" id="prob">大当たり確率 1/99.9 ・ 1パチ ・ 自動転＋自然リーチ＋宝箱</div>

  <div class="reels" id="reels">
    <div class="reel"><div class="strip" id="s0"></div></div>
    <div class="reel"><div class="strip" id="s1"></div></div>
    <div class="reel"><div class="strip" id="s2"></div></div>
  </div>

  <div class="info" id="info">準備中…</div>
  <div class="stat" id="stat">転数 <b>0</b> ・ 大当たり <b>0</b> ・ リーチ <b>0</b> ・ 実測 <b>—</b></div>

  <div class="ctrl">
    <button class="btn toggle" id="btnToggle">停止</button>
    <button class="btn reset" id="btnReset">リセット</button>
  </div>

    <span>大当たり確率 1 /</span>
    <input type="number" id="probInput" value="99.9" step="0.1" min="1" max="10000">

  </div>

    <h3>🏆 藏宝阁</h3>
    <div class="grid" id="grid"></div>
  </div>

    <h3>🐉 神龙图鉴</h3>
    <div class="dragon-grid" id="dragonGrid"></div>

</div>

<!-- 中奖弹窗 -->
<div class="modal-mask" id="winModal">
  <div class="modal">
    <div class="m-title">🎉 大当たり！</div>
    <span class="m-ico" id="mIco">💎</span>
    <div class="m-name" id="mName">钻石</div>
    <div class="m-cnt" id="mCnt">獲得 x1</div>
    <button class="m-btn" id="mBtn">続ける</button>
  </div>
</div>

<!-- 召唤神龙弹窗 -->
<div class="modal-mask" id="dragonModal">
  <div class="modal dragon-modal">
    <div class="m-title">✨ 神龙召唤！</div>
    <span class="m-ico dragon-ico" id="dIco">🐉</span>
    <div class="m-name" id="dName">青龙</div>
    <div class="m-cnt" id="dCnt">道具全收集！召唤神龙！</div>
    <button class="m-btn" id="dBtn">受け取る</button>
  </div>
</div>

<script>
const VERSION = "v1.2.3-20260819-2251"; // 每次修改必递增，否则视为未更新
const SYMBOLS = ["🐟","🐚","⭐","🌊","🐠","💎","🫧","🐙"];
const CELL = 83.33, VIS = 3, PAD = 12;
const PROB = 1/99.9;
let userDenominator = 99.9; // 用户自定义概率分母
function currentProb(){ return 1/userDenominator; }

// 10种宝藏
const TREASURES = [
  {ico:"🪙", nm:"金貨"}, {ico:"🥈", nm:"銀塊"}, {ico:"💎", nm:"钻石"},
  {ico:"💚", nm:"翡翠"}, {ico:"🔻", nm:"紅宝石"}, {ico:"🔷", nm:"藍宝石"},
  {ico:"🫧", nm:"真珠"}, {ico:"👑", nm:"皇冠"}, {ico:"⛰️", nm:"金銀山"}, {ico:"🔮", nm:"伝説の珠"}
];
let owned = new Array(10).fill(0);

// 5种神龙
const DRAGONS = [
  {ico:"🐲", nm:"青龙"}, {ico:"🐉", nm:"赤龙"}, {ico:"🟦", nm:"蓝龙"},
  {ico:"⚡", nm:"雷龙"}, {ico:"🌟", nm:"金龙"}
];
let dragonLit = new Array(5).fill(false); // 神龙点亮状态
let dragonSummoned = false; // 是否已召唤过神龙

let busy = false, auto = true, spins = 0, hits = 0, reachCount = 0;
const strips = [document.getElementById("s0"),document.getElementById("s1"),document.getElementById("s2")];
const el3 = strips[2];
const reelsBox = document.getElementById("reels");
const info = document.getElementById("info");
const stat = document.getElementById("stat");
const btnToggle = document.getElementById("btnToggle");
const grid = document.getElementById("grid");

function buildGrid(){
  grid.innerHTML = TREASURES.map((t,i)=>`
    <div class="item" id="item${i}">
      <div class="ico">${t.ico}</div>
      <div class="nm">${t.nm}</div>
      <div class="cnt" style="display:none">x0</div>
    </div>`).join("");
}
function refreshItem(i){
  const el = document.getElementById("item"+i);
  if (owned[i] > 0){
    el.classList.add("on");
    const cnt = el.querySelector(".cnt");
    cnt.style.display = "block"; cnt.textContent = "x"+owned[i];
  }
}
function buildDragonGrid(){
  const g = document.getElementById("dragonGrid");
  g.innerHTML = DRAGONS.map((d,i)=>`
    <div class="dragon" id="dragon${i}">
      <div class="d-ico">${d.ico}</div>
      <div class="d-nm">${d.nm}</div>
    </div>`).join("");
}
function refreshDragon(i){
  const el = document.getElementById("dragon"+i);
  if (dragonLit[i]){
    el.classList.add("on");
  }
}
function lightDragon(){
  // 每次大当たり必点亮一种神龙（优先未点亮的）
  const unlit = dragonLit.map((v,i)=>v? -1 : i).filter(i=>i>=0);
  let idx;
  if (unlit.length > 0){
    idx = unlit[(Math.random()*unlit.length)|0];
  } else {
    idx = (Math.random()*5)|0; // 全点亮后随机重复
  }
  dragonLit[idx] = true;
  refreshDragon(idx);
  return idx;
}
function checkAllTreasures(){
  return owned.every(x=>x>0);
}
function triggerShortShake(){
  document.body.classList.remove("win-shake");
  void document.body.offsetWidth;
  document.body.classList.add("win-shake");
  setTimeout(()=> document.body.classList.remove("win-shake"), 650);
}
function showDragonModal(idx){
  // 神龙召唤弹窗（短暂抖动0.6s）
  triggerShortShake();
  auto = false;
  document.getElementById("btnToggle").textContent = "開始";
  document.getElementById("dIco").textContent = DRAGONS[idx].ico;
  document.getElementById("dName").textContent = DRAGONS[idx].nm;
  document.getElementById("dCnt").textContent = dragonSummoned ? "神龙已觉醒！" : "道具全收集！召唤神龙！";
  document.getElementById("dragonModal").classList.add("show");
}
function grantTreasure(){
  const i = (Math.random()*10)|0;   // 随机1种
  owned[i]++;
  refreshItem(i);
  return i; // 返回掉落道具索引
}
function showWinModal(i){
  // 短暂抖动0.6s + 暂停 + 弹窗
  triggerShortShake();
  auto = false;
  const b = document.getElementById("btnToggle");
  b.textContent = "開始";
  document.getElementById("mIco").textContent = TREASURES[i].ico;
  document.getElementById("mName").textContent = TREASURES[i].nm;
  document.getElementById("mCnt").textContent = `獲得 x${owned[i]}`;
  document.getElementById("winModal").classList.add("show");
}

function buildStrip(el, finalIdx){
  const total = PAD*2 + 44;
  const arr = [];
  for (let i=0;i<total;i++) arr.push(SYMBOLS[(Math.random()*SYMBOLS.length)|0]);
  arr[PAD+1] = SYMBOLS[finalIdx];
  el.innerHTML = arr.map(s=>`<div class="cell">${s}</div>`).join("");
  return arr.length;
}
function setStrip(el, lens, dur){
  // strip が縦に並ぶ。中段（表示窓の2番目）に arr[PAD+1] が来るよう、
  // 開始位置 = strip 末尾付近（= 大きく回って見える）、停止位置 = -PAD*CELL
  const stopY = -(PAD)*CELL;                    // 中段 = arr[PAD+1]
  const startY = -((lens - VIS - 1) * CELL);    // strip の一番下から（何周も回って見える）
  el.style.transition = "none";
  el.style.transform = `translateY(${startY}px)`;   // まず末尾へ
  void el.offsetHeight;
  el.style.transition = `transform ${dur}s cubic-bezier(.12,.8,.25,1)`;
  el.style.transform = `translateY(${stopY}px)`;    // 目標位置へ滑る
}
function getCenter(el){
  // 中段（可见3格的中间格）的図柄を読む
  const cells = el.querySelectorAll(".cell");
  return cells.length ? cells[PAD+1].textContent : "";
}
function updateStat(){
  const rate = spins>0 ? (hits/spins*100).toFixed(3)+"%" : "—";
  const got = owned.filter(x=>x>0).length;
  stat.innerHTML = `転数 <b>${spins}</b> ・ 大当たり <b>${hits}</b> ・ リーチ <b>${reachCount}</b> ・ 宝藏 <b>${got}/10</b> ・ 実測 <b>${rate}</b>`;
}

function spinOnce(){
  if (busy) return;
  busy = true;
  try {
    reelsBox.className = "reels";
    info.className = "info"; info.textContent = "回転中…";

    // 中奖判定：按当前概率（演示1/10 或 用户自定义 1/分母）
    const isWin = (Math.random() < currentProb());
    let idx;
    if (isWin){
      // 中奖也走 reach 演出：先让第3列假符号，reach 时换真符号
      const s = (Math.random()*SYMBOLS.length)|0;
      let t; do { t = (Math.random()*SYMBOLS.length)|0; } while (t === s);
      idx = [s, s, t]; // 先制造 reach 假象
    } else {
      // 非中奖时：20% 概率制造"两同+第三异"（リーチ演出）→ 总リーチ率≈20%
      if (Math.random() < 0.2){
        const s = (Math.random()*SYMBOLS.length)|0;
        let t; do { t = (Math.random()*SYMBOLS.length)|0; } while (t === s);
        idx = [s, s, t]; // リーチ
      } else {
        // 非リーチ：三列全バラ（前2列が揃わないよう排除）→ 精确不触发自然リーチ
        let a, b, c;
        do { a = (Math.random()*SYMBOLS.length)|0; b = (Math.random()*SYMBOLS.length)|0; } while (a === b);
        c = (Math.random()*SYMBOLS.length)|0;
        idx = [a, b, c];
      }
    }
    const lens = strips.map((el,i)=> buildStrip(el, idx[i]));

    // 第1・2列：通常速度で先に止める（1.4s / 1.7s）
    setStrip(strips[0], lens[0], 1.4);
    setStrip(strips[1], lens[1], 1.7);
    // 第3列：まず3sで止まる予定（前2列が止まった後も回り続ける）
    setStrip(strips[2], lens[2], 3);

    // 1.8s 時点：前2列は停止済み（1.4s/1.7s）。idx（最終目標）で判定
    setTimeout(()=>{
      try {
        const [a,b,c] = idx;
        const twoSame = (a === b);
        if (twoSame && c !== a){
          // ★ 自然リーチ：画面で前2列が実際に同じ
          reelsBox.classList.add("reach");
          info.className = "info reach-txt"; info.textContent = "リーチ！！";
          // 如果是中奖，把第3列的最终符号改成匹配的
          const isActuallyWin = (a === c); // 之前不会是真中奖，因为 c !== a
          // 实际上 isWin 在外面定了，用外面的 isWin 判断
          // 第3列：① 高速でもう2周分まわる（1.2s linear）→ ② ゆっくり減速して停止（3.5s）
          const stopY = -(PAD)*CELL;                              // 最終停止位置（中段=目標図柄）
          const twoRoundsY = stopY - 2*SYMBOLS.length*CELL;       // 2周分下の位置
          // ① 現在位置から2周下へ高速移動（「まだ回ってる」感）
          el3.style.transition = `transform 1.2s linear`;
          el3.style.transform = `translateY(${twoRoundsY}px)`;
          // ② 1.2s後：2周下から最終位置へ極めてゆっくり戻す（減速停止・どんでん返し）
          setTimeout(()=>{
            try {
              // 如果是中奖，重写第3列的中间格子为匹配符号
              if (isWin) {
                const cells = el3.querySelectorAll(".cell");
                if (cells[PAD+1]) cells[PAD+1].textContent = SYMBOLS[a];
              }
              el3.style.transition = `transform 3.5s cubic-bezier(.05,.7,.1,1)`;
              el3.style.transform = `translateY(${stopY}px)`;
            } catch(e){}
          }, 1200);
          // 総リーチ時間：1.8 + 1.2 + 3.5 = 6.5s
          setTimeout(()=>{
            spins++; reachCount++;
            const fA = getCenter(strips[0]);
            const fB = getCenter(strips[1]);
            const fC = getCenter(strips[2]);
            if (fA===fB && fB===fC){
              hits++;
              const ti = grantTreasure();
              reelsBox.className="reels win"; info.className="info win-txt"; info.innerHTML="🎉 大当たり！";
              updateStat();
              const di = lightDragon();
              if (checkAllTreasures() && !dragonSummoned){
                dragonSummoned = true;
                showDragonModal(di);
              } else {
                showWinModal(ti);
              }
            } else {
              reelsBox.className="reels"; info.className="info miss-txt"; info.textContent="ハズレ";
              updateStat();
            }
            busy = false;
            if(auto) spinOnce();
          }, 4700);
            } else {
              // 非リーチ：第3列は3sで止まる → 残り1.2s待って確定
              setTimeout(()=>{
                spins++;
                const fA = getCenter(strips[0]);
                const fB = getCenter(strips[1]);
                const fC = getCenter(strips[2]);
                if (fA===fB && fB===fC){
                  hits++;
                  const ti = grantTreasure();
                  reelsBox.className="reels win"; info.className="info win-txt"; info.innerHTML="🎉 大当たり！";
                  updateStat();
                  const di = lightDragon();
                  if (checkAllTreasures() && !dragonSummoned){
                    dragonSummoned = true;
                    showDragonModal(di);
                  } else {
                    showWinModal(ti);
                  }
                } else {
                  reelsBox.className="reels"; info.className="info miss-txt"; info.textContent="ハズレ";
                  updateStat();
                }
                busy = false;
                if(auto) spinOnce();
              }, 1200);
            }
      } catch(e){
        console.error("spinOnce inner error:", e);
        busy=false;
      }
    }, 1800);
  } catch(e){
    console.error("spinOnce error:", e);
    busy=false;
  }
}

function startAuto(){ auto = true; btnToggle.textContent = "停止"; if(!busy) spinOnce(); }
function stopAuto(){ auto = false; btnToggle.textContent = "開始"; }
btnToggle.addEventListener("click", ()=> auto ? stopAuto() : startAuto());
function updateProbLabel(){
  const p = document.getElementById("prob");
  p.textContent = `大当たり確率 1/${userDenominator} ・ 1パチ ・ 自動転＋自然リーチ＋宝箱`;
}
document.getElementById("btnApply").addEventListener("click", ()=>{
  const v = parseFloat(document.getElementById("probInput").value);
  if (!isNaN(v) && v >= 1 && v <= 10000){
    userDenominator = v;
    updateProbLabel();
    info.textContent = `確率 1/${v} に変更`;
  } else {
    info.textContent = "1〜10000 の数字を入力";
  }
});
document.getElementById("btnReset").addEventListener("click", ()=>{
  spins=0; hits=0; reachCount=0; owned = new Array(10).fill(0);
  dragonLit = new Array(5).fill(false); dragonSummoned = false;
  buildGrid(); buildDragonGrid(); updateStat(); info.textContent="リセット済";
});
// 弹窗"続ける"：关闭弹窗、自动恢复游戏（抖动已在0.6s后自动停止）
document.getElementById("mBtn").addEventListener("click", ()=>{
  document.getElementById("winModal").classList.remove("show");
  startAuto();  // 自动继续
});
// 神龙弹窗"受け取る"：关闭、恢复游戏
document.getElementById("dBtn").addEventListener("click", ()=>{
  document.getElementById("dragonModal").classList.remove("show");
  startAuto();
});

function renderVersion(){
  const el = document.getElementById("version");
  if(el) el.innerHTML = `<b>${VERSION}</b> · Last-Modified: ${document.lastModified}`;
}
buildGrid(); buildDragonGrid(); updateStat(); updateProbLabel(); renderVersion(); startAuto();
</script>
</body>
</html>
