<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海物語 1/99.9 リーチ図柄＋宝箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #0a3d62 0%, #02233b 70%, #011019 100%);
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow-x: hidden; display: flex; flex-direction: column; align-items: center;
    color: #e8f4ff;
  }
  .phone { width: 100%; max-width: 430px; min-height: 100vh; padding: 14px; display: flex; flex-direction: column; align-items: center; }
  .title { font-size: 15px; letter-spacing: 2px; color: #7fdbff; text-shadow: 0 0 8px #2e9fe0; margin-bottom: 2px; }
  .prob { font-size: 12px; color: #ffd479; margin-bottom: 10px; }

  .reels { display: flex; gap: 10px; background: linear-gradient(180deg, #06121d, #0a1f30);
    border: 3px solid #1b4f72; border-radius: 16px; padding: 14px 12px;
    box-shadow: 0 0 24px rgba(46,159,224,.35), inset 0 0 18px rgba(0,0,0,.6); position: relative; }
  .reel { width: 84px; height: 250px; overflow: hidden; border-radius: 10px;
    background: linear-gradient(180deg, #021019, #04243a); position: relative;
    box-shadow: inset 0 12px 18px rgba(0,0,0,.7), inset 0 -12px 18px rgba(0,0,0,.7); }
  .strip { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; will-change: transform; }
  .cell { height: 83.33px; display: flex; align-items: center; justify-content: center; font-size: 46px; line-height: 1; }
  .reel::after { content: ""; position: absolute; top: 83.33px; left: 0; right: 0; height: 83.33px;
    border-top: 2px solid rgba(255,212,121,.5); border-bottom: 2px solid rgba(255,212,121,.5);
    background: rgba(255,212,121,.08); pointer-events: none; }
  .reels.reach .reel::after { border-color: #ff9f43; background: rgba(255,159,67,.18); box-shadow: 0 0 18px rgba(255,159,67,.6); }
  .reels.reach { animation: reachshake .1s linear infinite; box-shadow: 0 0 30px rgba(255,159,67,.7), inset 0 0 18px rgba(0,0,0,.6); }
  @keyframes reachshake { 0%{transform:translate(0,0)} 25%{transform:translate(-3px,2px)} 50%{transform:translate(3px,-2px)} 75%{transform:translate(-2px,-2px)} 100%{transform:translate(2px,2px)} }
  .reels.win { animation: winglow .4s ease-in-out infinite alternate; }
  .reels.win .reel::after { border-color: #ffe28a; background: rgba(255,212,121,.3); }
  @keyframes winglow { from{box-shadow:0 0 30px rgba(255,212,121,.6)} to{box-shadow:0 0 60px rgba(255,212,121,1)} }

  .info { margin-top: 12px; text-align: center; font-size: 15px; font-weight: 700; min-height: 22px; letter-spacing: 1px; }
  .info.reach-txt { color: #ff9f43; text-shadow: 0 0 10px rgba(255,159,67,.7); }
  .info.win-txt { color: #ffe28a; text-shadow: 0 0 12px rgba(255,212,121,.9); }
  .info.miss-txt { color: #6f9fc0; }
  .info.drop-txt { color: #6bff9e; }

  .stat { margin-top: 10px; font-size: 12px; color: #bfe3ff; text-align: center; }
  .stat b { color: #ffd479; }

  .ctrl { margin-top: 12px; display: flex; gap: 10px; }
  .btn { width: 110px; height: 46px; border: none; border-radius: 24px; font-size: 15px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
  .btn.toggle { background: linear-gradient(180deg,#ffd479,#ff9f43); color: #5a2e00; box-shadow: 0 4px 12px rgba(255,159,67,.5); }
  .btn.demo { background: linear-gradient(180deg,#6bff9e,#2ecc71); color: #003b1a; box-shadow: 0 4px 12px rgba(46,204,113,.5); width: 100px; }
  .btn.reset { background: rgba(27,79,114,.6); color: #bfe3ff; border: 1px solid #1b4f72; }
  .btn:active { transform: translateY(2px); }

  /* 藏宝阁 */
  .treasure { width: 100%; max-width: 390px; margin-top: 16px;
    background: rgba(6,18,29,.7); border: 1px solid #1b4f72; border-radius: 14px; padding: 12px 14px 16px; }
  .treasure h3 { font-size: 13px; color: #ffd479; letter-spacing: 2px; text-align: center; margin-bottom: 10px; text-shadow: 0 0 8px rgba(255,212,121,.5); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .item { aspect-ratio: 1; border-radius: 10px; background: rgba(2,16,25,.8); border: 1px solid #143a55;
    display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .item .ico { font-size: 30px; line-height: 1; filter: grayscale(1) brightness(.35); opacity: .5; transition: .3s; }
  .item.on .ico { filter: none; opacity: 1; text-shadow: 0 0 10px rgba(255,212,121,.8); animation: pop .4s ease; }
  @keyframes pop { 0%{transform:scale(.4)} 60%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .item .nm { font-size: 9px; color: #8fb8d6; margin-top: 2px; text-align: center; }
  .item.on .nm { color: #ffe28a; }
  .item .cnt { position: absolute; top: 3px; right: 4px; font-size: 10px; font-weight: 700; color: #6bff9e; background: rgba(0,0,0,.5); border-radius: 8px; padding: 0 4px; }
  .item .owned { position: absolute; bottom: 3px; font-size: 9px; color: #6bff9e; }
  .credit { margin-top: 14px; font-size: 11px; color: #4a7ba3; text-align: center; }
</style>
</head>
<body>
<div class="phone">
  <div class="title">🌊 海物語 1/99.9</div>
  <div class="prob" id="prob">大当たり確率 1/99.9 ・ 1パチ ・ 自動転＋自然リーチ＋宝箱</div>

  <div class="reels" id="reels">
    <div class="reel"><div class="strip" id="s0"></div></div>
    <div class="reel"><div class="strip" id="s1"></div></div>
    <div class="reel"><div class="strip" id="s2"></div></div>
  </div>

  <div class="info" id="info">準備中…</div>
  <div class="stat" id="stat">転数 <b>0</b> ・ 大当たり <b>0</b> ・ リーチ <b>0</b> ・ 実測 <b>—</b></div>

  <div class="ctrl">
    <button class="btn toggle" id="btnToggle">停止</button>
    <button class="btn demo" id="btnDemo">演示:OFF</button>
    <button class="btn reset" id="btnReset">リセット</button>
  </div>

  <div class="treasure">
    <h3>🏆 藏宝阁</h3>
    <div class="grid" id="grid"></div>
  </div>

  <div class="credit">umi-monogatari · reach + treasure demo</div>
</div>

<script>
const SYMBOLS = ["🐟","🐚","⭐","🌊","🐠","💎","🫧","🐙"];
const CELL = 83.33, VIS = 3, PAD = 12;
const PROB = 1/99.9;
let demoMode = false; // 演示模式：1/10 概率
function currentProb(){ return demoMode ? 1/10 : PROB; }

// 10种宝藏
const TREASURES = [
  {ico:"🪙", nm:"金貨"}, {ico:"🥈", nm:"銀塊"}, {ico:"💎", nm:"钻石"},
  {ico:"💚", nm:"翡翠"}, {ico:"🔻", nm:"紅宝石"}, {ico:"🔷", nm:"藍宝石"},
  {ico:"🫧", nm:"真珠"}, {ico:"👑", nm:"皇冠"}, {ico:"⛰️", nm:"金銀山"}, {ico:"🔮", nm:"伝説の珠"}
];
let owned = new Array(10).fill(0);

let busy = false, auto = true, spins = 0, hits = 0, reachCount = 0;
const strips = [document.getElementById("s0"),document.getElementById("s1"),document.getElementById("s2")];
const el3 = strips[2];
const reelsBox = document.getElementById("reels");
const info = document.getElementById("info");
const stat = document.getElementById("stat");
const btnToggle = document.getElementById("btnToggle");
const grid = document.getElementById("grid");

function buildGrid(){
  grid.innerHTML = TREASURES.map((t,i)=>`
    <div class="item" id="item${i}">
      <div class="ico">${t.ico}</div>
      <div class="nm">${t.nm}</div>
      <div class="cnt" style="display:none">x0</div>
    </div>`).join("");
}
function refreshItem(i){
  const el = document.getElementById("item"+i);
  if (owned[i] > 0){
    el.classList.add("on");
    const cnt = el.querySelector(".cnt");
    cnt.style.display = "block"; cnt.textContent = "x"+owned[i];
  }
}
function grantTreasure(){
  const i = (Math.random()*10)|0;   // 随机1种
  owned[i]++;
  refreshItem(i);
  info.className = "info drop-txt";
  info.innerHTML = `🎁 ${TREASURES[i].nm} ゲット！ (x${owned[i]})`;
}

function buildStrip(el, finalIdx){
  const total = PAD*2 + 44;
  const arr = [];
  for (let i=0;i<total;i++) arr.push(SYMBOLS[(Math.random()*SYMBOLS.length)|0]);
  arr[PAD+1] = SYMBOLS[finalIdx];
  el.innerHTML = arr.map(s=>`<div class="cell">${s}</div>`).join("");
  return arr.length;
}
function setStrip(el, lens, dur){
  // strip が縦に並ぶ。中段（表示窓の2番目）に arr[PAD+1] が来るよう、
  // 開始位置 = strip 末尾付近（= 大きく回って見える）、停止位置 = -PAD*CELL
  const stopY = -(PAD)*CELL;                    // 中段 = arr[PAD+1]
  const startY = -((lens - VIS - 1) * CELL);    // strip の一番下から（何周も回って見える）
  el.style.transition = "none";
  el.style.transform = `translateY(${startY}px)`;   // まず末尾へ
  void el.offsetHeight;
  el.style.transition = `transform ${dur}s cubic-bezier(.12,.8,.25,1)`;
  el.style.transform = `translateY(${stopY}px)`;    // 目標位置へ滑る
}
function getCenter(el){
  // 中段（可见3格的中间格）的図柄を読む
  const cells = el.querySelectorAll(".cell");
  return cells.length ? cells[PAD+1].textContent : "";
}
function updateStat(){
  const rate = spins>0 ? (hits/spins*100).toFixed(3)+"%" : "—";
  const got = owned.filter(x=>x>0).length;
  stat.innerHTML = `転数 <b>${spins}</b> ・ 大当たり <b>${hits}</b> ・ リーチ <b>${reachCount}</b> ・ 宝藏 <b>${got}/10</b> ・ 実測 <b>${rate}</b>`;
}

function spinOnce(){
  if (busy) return;
  busy = true;
  try {
    reelsBox.className = "reels";
    info.className = "info"; info.textContent = "回転中…";

    // 中奖判定：演示模式按 1/10，真实模式按三列自然全同（1/64 ≈ 1/99.9 近似）
    const isWin = demoMode ? (Math.random() < 0.1) : false;
    let idx;
    if (isWin){
      const s = (Math.random()*SYMBOLS.length)|0;
      idx = [s,s,s]; // 强制三同 → 中奖
    } else {
      // 非中奖时：30% 概率制造"两同+第三异"（リーチ演出），让用户能看到动画
      if (Math.random() < 0.3){
        const s = (Math.random()*SYMBOLS.length)|0;
        let t; do { t = (Math.random()*SYMBOLS.length)|0; } while (t === s);
        idx = [s, s, t]; // リーチ
      } else {
        idx = [(Math.random()*SYMBOLS.length)|0,(Math.random()*SYMBOLS.length)|0,(Math.random()*SYMBOLS.length)|0];
      }
    }
    const lens = strips.map((el,i)=> buildStrip(el, idx[i]));

    // 第1・2列：通常速度で先に止める（1.4s / 1.7s）
    setStrip(strips[0], lens[0], 1.4);
    setStrip(strips[1], lens[1], 1.7);
    // 第3列：まず3sで止まる予定（前2列が止まった後も回り続ける）
    setStrip(strips[2], lens[2], 3);

    // 1.8s 時点：前2列は停止済み（1.4s/1.7s）。実際の表示を読んで判定（idx ではなく DOM）
    setTimeout(()=>{
      try {
        const [a,b,c] = idx;
        const actualA = getCenter(strips[0]);
        const actualB = getCenter(strips[1]);
        const actualC = getCenter(strips[2]);
        const twoSame = (actualA === actualB);
        if (twoSame && actualC !== actualA){
          // ★ 自然リーチ：画面で前2列が実際に同じ
          reelsBox.classList.add("reach");
          info.className = "info reach-txt"; info.textContent = "リーチ！！";
          // 第3列：① 高速でもう2周分まわる（1.2s linear）→ ② ゆっくり減速して停止（3.5s）
          const stopY = -(PAD)*CELL;                              // 最終停止位置（中段=目標図柄）
          const twoRoundsY = stopY - 2*SYMBOLS.length*CELL;       // 2周分下の位置
          // ① 現在位置から2周下へ高速移動（「まだ回ってる」感）
          el3.style.transition = `transform 1.2s linear`;
          el3.style.transform = `translateY(${twoRoundsY}px)`;
          // ② 1.2s後：2周下から最終位置へ極めてゆっくり戻す（減速停止・どんでん返し）
          setTimeout(()=>{
            try {
              el3.style.transition = `transform 3.5s cubic-bezier(.05,.7,.1,1)`;
              el3.style.transform = `translateY(${stopY}px)`;
            } catch(e){}
          }, 1200);
          // 総リーチ時間：1.8 + 1.2 + 3.5 = 6.5s
          setTimeout(()=>{
            try {
              spins++; reachCount++;
              // 最終表示で三同なら大当たり（実際の表示に基づく）
              const fA = getCenter(strips[0]);
              const fB = getCenter(strips[1]);
              const fC = getCenter(strips[2]);
              if (fA===fB && fB===fC){
                hits++; grantTreasure();
                reelsBox.className="reels win"; info.className="info win-txt"; info.innerHTML="🎉 大当たり！";
              } else {
                reelsBox.className="reels"; info.className="info miss-txt"; info.textContent="ハズレ";
              }
              updateStat();
            } finally { busy=false; if(auto) spinOnce(); }
          }, 4700);
        } else {
          // 非リーチ：第3列は3sで止まる → 残り1.2s待って確定
          setTimeout(()=>{
            try {
              spins++;
              const fA = getCenter(strips[0]);
              const fB = getCenter(strips[1]);
              const fC = getCenter(strips[2]);
              if (fA===fB && fB===fC){
                hits++; grantTreasure();
                reelsBox.className="reels win"; info.className="info win-txt"; info.innerHTML="🎉 大当たり！";
              } else {
                reelsBox.className="reels"; info.className="info miss-txt"; info.textContent="ハズレ";
              }
              updateStat();
            } finally { busy=false; if(auto) spinOnce(); }
          }, 1200);
        }
      } catch(e){
        console.error("spinOnce inner error:", e);
        busy=false;
      }
    }, 1800);
  } catch(e){
    console.error("spinOnce error:", e);
    busy=false;
  }
}

function startAuto(){ auto = true; btnToggle.textContent = "停止"; if(!busy) spinOnce(); }
function stopAuto(){ auto = false; btnToggle.textContent = "開始"; }
btnToggle.addEventListener("click", ()=> auto ? stopAuto() : startAuto());
document.getElementById("btnDemo").addEventListener("click", ()=>{
  demoMode = !demoMode;
  const b = document.getElementById("btnDemo");
  b.textContent = "演示:"+(demoMode?"ON":"OFF");
  const p = document.getElementById("prob");
  p.textContent = demoMode ? "演示モード 大当たり確率 1/10" : "大当たり確率 1/99.9 ・ 1パチ ・ 自動転＋自然リーチ＋宝箱";
});
document.getElementById("btnReset").addEventListener("click", ()=>{
  spins=0; hits=0; reachCount=0; owned = new Array(10).fill(0);
  buildGrid(); updateStat(); info.textContent="リセット済";
});

buildGrid(); updateStat(); startAuto();
</script>
</body>
</html>
